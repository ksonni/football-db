# Exposes ports for debugging
version: '3'
services:
  db:
    platform: linux/x86_64
    image: 'db:latest'
    build:
      context: .
      dockerfile: db/Dockerfile
    env_file:
      - .env-debug
    volumes:
      - db-volume:/var/lib/mysql
    ports:
      - "3306:3306"
  backend:
    image: backend:latest
    env_file:
      - .env-debug
    environment:
      - JAVA_OPTS=-Xdebug -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8000
    build:
      context: backend
      dockerfile: Dockerfile
    ports:
      - "80:8080"
      - "8000:8000"
    depends_on:
      - db
volumes:
  db-volume:
