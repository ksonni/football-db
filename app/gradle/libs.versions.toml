[versions]
java = "17"
spring = "3.4.3"
mapstruct = "1.4.2.Final"
checkstyle = "8.40"

[libraries]

# Spring
springData = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "spring" }
springValidation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "spring" }
springSecurity = { module = "org.springframework.boot:spring-boot-starter-security", version.ref = "spring" }
springWeb = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring" }
springOpenApi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version = "2.8.5" }

# Codegen
lombok = { module = "org.projectlombok:lombok", version = "1.18.36" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstructProcessor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
mapstructBinding = { module = "org.projectlombok:lombok-mapstruct-binding", version = "0.2.0" }

# Database
liquibase = { module = "org.liquibase:liquibase-core", version = "4.31.1" }
mysql = { module = "com.mysql:mysql-connector-j", version = "9.2.0" }

# Utilities
apacheHttp = { module = "org.apache.httpcomponents:httpclient", version = "4.5.13" }
apacheTika = { module = "org.apache.tika:tika-core", version = "3.1.0" }
bucket4j = { module = "com.bucket4j:bucket4j-core", version = "8.10.1" }

# Testing
springTest = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring" }
springSecurityTest = { module = "org.springframework.security:spring-security-test", version = "6.4.3" }
mockito = { module = "org.mockito:mockito-core", version = "5.15.2" }

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "spring" }
springDeps = { id = "io.spring.dependency-management", version = "1.1.7" }