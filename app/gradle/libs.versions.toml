[versions]
java = "17"
spring = "3.4.4"
mapstruct = "1.4.2.Final"
checkstyle = "10.21.3"

[libraries]

# Spring
spring-data = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "spring" }
spring-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "spring" }
spring-security = { module = "org.springframework.boot:spring-boot-starter-security", version.ref = "spring" }
spring-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring" }
spring-graphql = { module = "org.springframework.boot:spring-boot-starter-graphql", version.ref = "spring" }
spring-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version = "2.8.5" }

# Codegen
lombok = { module = "org.projectlombok:lombok", version = "1.18.36" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version = "0.2.0" }

# Database
liquibase = { module = "org.liquibase:liquibase-core", version = "4.31.1" }
mysql = { module = "com.mysql:mysql-connector-j", version = "9.2.0" }

# Utilities
apache-http = { module = "org.apache.httpcomponents:httpclient", version = "4.5.13" }
apache-tika = { module = "org.apache.tika:tika-core", version = "3.1.0" }
bucket4j = { module = "com.bucket4j:bucket4j-core", version = "8.10.1" }

# Testing
spring-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring" }
spring-graphql-test = { module = "org.springframework.graphql:spring-graphql-test", version = "1.3.4" }
spring-security-test = { module = "org.springframework.security:spring-security-test", version = "6.4.3" }
mockito = { module = "org.mockito:mockito-core", version = "5.15.2" }
webflux = { module = "org.springframework:spring-webflux", version = "7.0.0-M2" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring" }
spring-deps = { id = "io.spring.dependency-management", version = "1.1.7" }
graphql-codegen = { id = "io.github.kobylynskyi.graphql.codegen", version = "5.10.0" }
