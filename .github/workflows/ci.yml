name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: adopt
    - uses: gradle/actions/setup-gradle@v3
    - name: Run Gradle build
      run: cd app && ./gradlew build

