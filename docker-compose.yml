version: '3'
services:
  db:
    platform: linux/x86_64
    image: 'db:latest'
    build:
      context: .
      dockerfile: db/Dockerfile
    env_file:
      - .env
    volumes:
      - db-volume:/var/lib/mysql
    restart: on-failure
  backend:
    image: backend:latest
    env_file:
      - .env
    build:
      context: backend
      dockerfile: Dockerfile
    depends_on:
      - db
    restart: on-failure
  ui:
    image: ui:latest
    build:
      context: ui
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: on-failure
volumes:
  db-volume:
